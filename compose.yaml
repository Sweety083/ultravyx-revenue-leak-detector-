services:
  postgres:
    image: postgres:17-alpine
    container_name: ultravyx-postgres
    environment:
      POSTGRES_DB: ultravyx
      POSTGRES_USER: ultravyx
      POSTGRES_PASSWORD: ultravyx_dev
    ports:
      - "5432:5432"
    volumes:
      - ultravyx_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ultravyx -d ultravyx"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ultravyx_postgres_data:
