server:
  port: 8080
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ultravyx}
    username: ${DB_USER:ultravyx}
    password: ${DB_PASSWORD:ultravyx_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
ultravyx:
  leaks:
    uncontacted: PT24H
    slow-response: PT60M
    qualified-not-progressed: P7D
  cors-origin: ${CORS_ORIGIN:http://localhost:4200,http://127.0.0.1:4200}
